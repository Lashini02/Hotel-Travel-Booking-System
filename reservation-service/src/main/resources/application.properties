# Server Configuration
server.port=8083
spring.application.name=reservation-service

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/reservation_db}

# API Key Security Configuration (Student 3 Responsibility)
api.key.header=X-API-KEY
api.key.value=${SERVICE_API_KEY:reservation-secret-api-key-12345}

# OpenAPI / Swagger UI Settings
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.show-actuator=true

# Logging
logging.level.com.hotelbooking.reservation=DEBUG
logging.level.org.springframework.data.mongodb=INFO
