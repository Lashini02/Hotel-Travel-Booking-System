services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: hotel_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hotel_db
    volumes:
      - mongo_data:/data/db
    networks:
      - hotel_net

  # Mongo Express (Web UI for viewing MongoDB data in browser)
  mongo-express:
    image: mongo-express:latest
    container_name: hotel_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - hotel_net

  # Student 2: Hotel & Room Service Microservice
  hotel-room-service:
    build:
      context: ./hotel-room-service
      dockerfile: Dockerfile
    container_name: hotel_room_service
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: hotel_db
      SECURITY_API_KEY: hotel-service-secret-key-123
    depends_on:
      - mongodb
    networks:
      - hotel_net

volumes:
  mongo_data:

networks:
  hotel_net:
    driver: bridge
