services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: soc-mongodb
    restart: always
    ports:
      - "27019:27017"
    environment:
      - MONGO_INITDB_DATABASE=soc_auth_db
    volumes:
      - mongo_data:/data/db
    networks:
      - soc-network

  # Student 1: Gateway & Auth Microservice
  auth-gateway-service:
    build:
      context: ./auth-gateway-service
      dockerfile: Dockerfile
    image: soc-auth-gateway-service:1.0
    container_name: soc-auth-gateway-service
    restart: always
    ports:
      - "8085:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/soc_auth_db
    depends_on:
      - mongodb
    networks:
      - soc-network

  # Student 2: Hotel & Room Service
  hotel-room-service:
    build:
      context: ./hotel-room-service
      dockerfile: Dockerfile
    container_name: hotel_room_service
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=hotel_db
    depends_on:
      - mongodb
    networks:
      - soc-network

  # Student 3: Reservation Service
  reservation-service:
    build:
      context: ./reservation-service
      dockerfile: Dockerfile
    container_name: reservation-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/reservation_db
      - SPRING_DATA_MONGODB_HOST=mongodb
    depends_on:
      - mongodb
    networks:
      - soc-network

  # Student 4: Review & Rating Service
  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: review-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/review_db
      - SPRING_DATA_MONGODB_HOST=mongodb
    depends_on:
      - mongodb
    networks:
      - soc-network

  # Student 5: Notification & Offer Service
  notification-offer-service:
    build:
      context: ./notification-offer-service
      dockerfile: Dockerfile
    container_name: notification-offer-service
    restart: always
    ports:
      - "8086:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/notification_db
      - SPRING_DATA_MONGODB_HOST=mongodb
    depends_on:
      - mongodb
    networks:
      - soc-network

  # Unified Client Frontend Application
  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: soc-client-app
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - auth-gateway-service
    networks:
      - soc-network

networks:
  soc-network:
    driver: bridge

volumes:
  mongo_data:
